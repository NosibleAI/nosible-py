[project]
name = "nosible"
version = "0.4.0"
description = "Python client for the NOSIBLE Search and World APIs"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
authors = [
  { name = "Stuart Reid", email = "stuart@nosible.com" },
  { name = "Matthew Dicks", email = "matthew@nosible.com" },
  { name = "Richard Taylor", email = "richard@nosible.com" },
  { name = "Gareth Warburton", email = "gareth@nosible.com" },
]

dependencies = [
  "httpx>=0.25.0,<0.29.0",
  "openai>=1.3.0",
  "pyrate-limiter>=3.1.0,<4",
  "cryptography>=41.0.0",
  "zstandard>=0.22.0",
  "polars>=0.20.0",
  "duckdb>=0.9.2",
  "pyarrow>=14.0.0",
  "pandas>=2.0.0",
  "tantivy>=0.21.0",
]

dynamic = ["license"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/NosibleAI/nosible-py"
Documentation = "https://nosible-py.readthedocs.io/en/latest/"

[build-system]
requires = ["setuptools>=75.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = [
  "B",
  "BLE",
  "C4",
  "DTZ",
  "E",
  "F",
  "I",
  "PIE",
  "RET",
  "RUF",
  "S",
  "SIM",
  "W",
]
ignore = [
  "RUF012",
  "RUF013",
  "S608",
  "SIM905",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
force-to-top = ["os"]

[tool.uv]
dev-dependencies = [
  "pytest",
  "pytest-doctestplus",
  "pytest-xdist",
  "urllib3==1.26.15",
  "hishel[async]>=1.1.0",
]
